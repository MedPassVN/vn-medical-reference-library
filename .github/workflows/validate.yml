name: Validate library

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler (pdfinfo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Validate library.json ↔ raw_sources ↔ markdown_docs
        run: python3 scripts/validate_library.py --report audit/registry_report.json
      - name: README table in sync with library.json
        run: python3 scripts/build_readme_table.py --check
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-report
          path: audit/registry_report.json
